[package]
name = "vigie-rs"
version = "0.2.1"
edition = "2021"
license = "MIT"

[dependencies]
cxx = "1"
cxx-qt = "0.10"
cxx-qt-lib = { version = "0.10", features = ["qt_gui", "qt_qml"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Dossiers de configuration, de données et de cache propres à chaque système.
dirs = "7"
# Logos des recipes rognés de leurs marges (rendu SVG en Rust pur).
resvg = "0.49"
# Empreinte du mot de passe de verrouillage.
argon2 = "0.5"
password-hash = { version = "0.5", features = ["getrandom"] }
# Mises à jour : API GitHub, téléchargement, vérification (SHA-256) et extraction des releases.
ureq = { version = "2", features = ["json"] }
sha2 = "0.10"
tar = "0.4"
flate2 = "1"

# Interface D-Bus io.github.vigie_rs.Vigie (compteurs, instance unique) : Linux seulement.
[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "5", default-features = false, features = ["blocking-api", "async-io"] }

[build-dependencies]
cxx-qt-build = "0.10"
